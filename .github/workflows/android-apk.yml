# Android APK чогултуу (Play Market'сиз таратуу үчүн).
# Иштетүү: GitHub → Actions → «Android APK» → Run workflow.
# Даяр APK бул жерден жүктөлөт:
#   https://github.com/<логин>/<репозиторий>/releases/download/android-latest/jorgo.apk
#
# Керектүү жөндөө (бир жолу):
#   Settings → Secrets and variables → Actions → New repository secret
#     EXPO_TOKEN  (expo.dev → Account settings → Access tokens)
# expo.dev долбоорунун ID'си жана ээси app.config.js файлында.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Жаңы чогултпай, Expo'до акыркы даяр болгон APK'ны жарыялоо"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Expo'нун акысыз кезеги кээде узак болот
    timeout-minutes: 180
    steps:
      - name: Check settings
        env:
          HAS_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then echo "::error::EXPO_TOKEN secret кошулган эмес"; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 27.4.0
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build APK on EAS
        if: ${{ !inputs.publish_only }}
        run: eas build --platform android --profile preview --non-interactive --wait --json > build.json

      - name: Find latest finished APK on EAS
        if: ${{ inputs.publish_only }}
        run: eas build:list --platform android --status finished --limit 1 --json --non-interactive > build.json

      - name: Download APK
        run: |
          URL=$(jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl' build.json)
          echo "APK: $URL"
          curl -fsSL "$URL" -o jorgo.apk
          ls -lh jorgo.apk

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest jorgo.apk \
            --title "Jorgo Android колдонмосу" \
            --notes "Акыркы APK. Жүктөп алып, «белгисиз булактан орнотууга» уруксат бериңиз." \
            --latest=false
          echo "Шилтеме: https://github.com/${{ github.repository }}/releases/download/android-latest/jorgo.apk" >> "$GITHUB_STEP_SUMMARY"
