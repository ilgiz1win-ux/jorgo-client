# Android APK чогултуу (Play Market'сиз таратуу үчүн).
# Иштетүү: GitHub → Actions → «Android APK» → Run workflow.
# Даяр APK бул жерден жүктөлөт:
#   https://github.com/<логин>/<репозиторий>/releases/download/android-latest/jorgo.apk
#
# Керектүү жөндөөлөр (бир жолу):
#   Settings → Secrets and variables → Actions
#     Secrets:   EXPO_TOKEN      (expo.dev → Account settings → Access tokens)
#     Variables: EAS_PROJECT_ID  (expo.dev → долбоор → Project ID)
#                EXPO_OWNER      (expo.dev'деги колдонуучу атыңыз)
name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
    steps:
      - name: Check settings
        env:
          HAS_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then echo "::error::EXPO_TOKEN secret кошулган эмес"; exit 1; fi
          if [ -z "$EAS_PROJECT_ID" ]; then echo "::error::EAS_PROJECT_ID variable кошулган эмес"; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 27.4.0
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build APK on EAS
        run: eas build --platform android --profile preview --non-interactive --wait --json > build.json

      - name: Download APK
        run: |
          URL=$(jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl' build.json)
          echo "APK: $URL"
          curl -fsSL "$URL" -o jorgo.apk
          ls -lh jorgo.apk

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest jorgo.apk \
            --title "Jorgo Android колдонмосу" \
            --notes "Акыркы APK. Жүктөп алып, «белгисиз булактан орнотууга» уруксат бериңиз." \
            --latest=false
          echo "Шилтеме: https://github.com/${{ github.repository }}/releases/download/android-latest/jorgo.apk" >> "$GITHUB_STEP_SUMMARY"
