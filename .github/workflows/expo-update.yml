# Колдонмого абадан жаңылоо жөнөтүү (жаңы APK курбай).
# GitHub → Actions → «Expo update» → Run workflow.
# Орнотулган колдонмо кийинки ачылганда жаңы кодду өзү жүктөйт.
# Жаңы уруксат же жаңы нативдик модуль кошулса — жаңы APK керек (Android APK workflow).
name: Expo update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Канал: preview (APK) же production (Play Market / App Store)"
        type: choice
        options: [preview, production]
        default: preview
      message:
        description: "Эмне өзгөрдү (кыскача)"
        type: string
        default: "Жаңылоо"

concurrency:
  group: expo-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check settings
        env:
          HAS_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then echo "::error::EXPO_TOKEN secret кошулган эмес"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 27.4.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Publish update
        env:
          APP_VARIANT: client
          MESSAGE: ${{ inputs.message }}
        run: eas update --channel "${{ inputs.channel }}" --message "$MESSAGE" --platform all --non-interactive
